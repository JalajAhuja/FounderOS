[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "founder"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro[jupyter]~=1.6.0",
    "kedro-datasets[pandas-csvdataset, pandas-exceldataset, pandas-parquetdataset, plotly-plotlydataset, plotly-jsondataset, matplotlib-matplotlibdataset, spark-sparkdataset]>=9.1",
    "kedro-viz>=6.7.0",
    "scikit-learn~=1.5.1; python_version <= '3.10'",
    "scikit-learn~=1.8.0; python_version > '3.10'",
    "seaborn~=0.12.1",
]

[project.scripts]
founder = "founder.__main__:main"

[project.entry-points."kedro.hooks"]

[project.optional-dependencies]
dev = [
    "pytest-cov>=3,<7",
    "pytest-mock>=1.7.1, <2.0",
    "pytest~=7.2",
    "ruff~=0.12.0",
]

[tool.setuptools.dynamic.version]
attr = "founder.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "founder"
project_name = "Founder"
kedro_init_version = "1.6.0"
tools = "['Linting', 'Testing', 'Custom Logging', 'Data Structure', 'PySpark']"
example_pipeline = "False"
source_dir = "src"

[tool.coverage.report]
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "PL",
    "T201",
]
ignore = [
    "E501",
    "PLR2004",  # magic values are fine in this codebase
    "PLR0913",  # many-argument functions
    "PLR0917",
    "PLW2901",  # loop variable reassignment
    "PLW0603",  # module-level lazy singletons use `global`
    "PLC0415",  # lazy imports keep optional deps (langfuse, fastembed) optional
    "PLR0912",  # complexity of ingestion/validation scripts
    "PLR0915",
    "PLW0108",
    "UP038",    # deprecated upstream; style-only
]

[tool.ruff.lint.per-file-ignores]
# CLI / ingestion scripts and tests legitimately print.
"src/founder/**/*" = ["T201"]
"tests/**/*" = ["T201"]
